# ============================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# ============================================================================

# Application Identity & Port
spring.application.name=LibraryManagementAPI
server.port=8080

# MySQL Database Configuration
# NOTE FOR VIVA: The database 'mse_java_exam_db' must exist in MySQL before startup.
# In production, credentials should be loaded from environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/mse_java_exam_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Harsh@1728
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatic Database Initialization via schema.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Static Resources Mapping (serves index.html at http://localhost:8080/)
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.kiet.examproject=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
